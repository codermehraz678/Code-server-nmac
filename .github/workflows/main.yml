name: "☁️ macOS Remote Dev Environment"

on:
  workflow_dispatch:
    inputs:
      session-timeout:
        description: "Session duration (minutes, max 360)"
        required: false
        default: "360"
        type: choice
        options:
          - "60"
          - "120"
          - "240"
          - "360"
      code-server-port:
        description: "code-server port"
        required: false
        default: "8080"
        type: string

permissions:
  contents: read

jobs:
  remote-dev:
    name: "🖥️ Spawn macOS Dev Machine"
    runs-on: macos-latest
    timeout-minutes: ${{ fromJSON(github.event.inputs['session-timeout'] || '360') }}

    defaults:
      run:
        shell: bash

    env:
      WORKSPACE: ${{ runner.temp }}/dev-workspace
      PORT: ${{ github.event.inputs['code-server-port'] || '8080' }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"

    steps:
      # ── 1. Checkout ──────────────────────────────────────
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      # ── 2. Workspace & Downloads ─────────────────────────
      - name: 📁 Prepare workspace and Downloads folder
        run: |
          set -euo pipefail

          mkdir -p "$WORKSPACE"
          mkdir -p "$HOME/Downloads"
          mkdir -p "$WORKSPACE/project"

          # Symlink Downloads into the workspace so code-server can browse it
          ln -sfn "$HOME/Downloads" "$WORKSPACE/Downloads"

          # Copy the checked-out repo into workspace safely
          if command -v rsync >/dev/null 2>&1; then
            rsync -a --exclude='.git' "$GITHUB_WORKSPACE/" "$WORKSPACE/project/"
          else
            cp -R "$GITHUB_WORKSPACE/." "$WORKSPACE/project/"
            rm -rf "$WORKSPACE/project/.git"
          fi

          echo "✅ Workspace ready at $WORKSPACE"
          ls -la "$WORKSPACE"

      # ── 3. Node.js ───────────────────────────────────────
      - name: ⬢ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ── 4. Tailscale ─────────────────────────────────────
      - name: 🔗 Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: gh-macos-${{ github.run_id }}
          version: latest

      # ── 5. Install code-server ───────────────────────────
      - name: 🖥️ Install code-server
        run: |
          set -euo pipefail

          # Support both Apple Silicon and Intel Homebrew locations
          if [[ -x /opt/homebrew/bin/brew ]]; then
            eval "$(/opt/homebrew/bin/brew shellenv)"
          elif [[ -x /usr/local/bin/brew ]]; then
            eval "$(/usr/local/bin/brew shellenv)"
          fi

          brew update || true
          brew install --formula code-server

          # Make code-server available in later steps
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          export PATH="$(brew --prefix)/bin:$PATH"

          code-server --version

      # ── 6. Install Claude CLI ────────────────────────────
      - name: 🤖 Install Claude CLI
        run: |
          set -euo pipefail

          npm install -g @anthropic-ai/claude-code

          echo "Claude CLI version:"
          claude --version || echo "Installed (version check may require auth)"

      # ── 7. Persist env vars for interactive shells ───────
      - name: 🔐 Configure environment for interactive sessions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail

          if [[ -x /opt/homebrew/bin/brew ]]; then
            eval "$(/opt/homebrew/bin/brew shellenv)"
          elif [[ -x /usr/local/bin/brew ]]; then
            eval "$(/usr/local/bin/brew shellenv)"
          fi

          NPM_GLOBAL_BIN="$(npm prefix -g)/bin"
          BREW_BIN="$(brew --prefix)/bin"

          # macOS default interactive shell is usually zsh,
          # but we configure bash too for compatibility.
          for PROFILE in "$HOME/.zshrc" "$HOME/.bashrc"; do
            touch "$PROFILE"

            {
              echo ""
              echo "# ── GitHub Actions macOS Dev Environment ──"
              printf 'export ANTHROPIC_API_KEY=%q\n' "${ANTHROPIC_API_KEY:-}"
              echo "export PATH=\"${BREW_BIN}:${NPM_GLOBAL_BIN}:\$PATH\""
              echo "export WORKSPACE=\"${WORKSPACE}\""
              echo "alias downloads='cd ~/Downloads && ls -la'"
              echo "alias ws='cd \"${WORKSPACE}\" && ls -la'"
            } >> "$PROFILE"
          done

          echo "✅ Shell environment configured"

      # ── 8. Resolve code-server password ──────────────────
      - name: 🔑 Resolve code-server password
        env:
          CODE_SERVER_PASSWORD: ${{ secrets.CODE_SERVER_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "${CODE_SERVER_PASSWORD:-}" ]]; then
            CODE_SERVER_PASSWORD="MEHRAZ123."
          fi

          echo "CODE_SERVER_PASSWORD=$CODE_SERVER_PASSWORD" >> "$GITHUB_ENV"

      # ── 9. Configure & start code-server ─────────────────
      - name: 🚀 Configure and start code-server
        run: |
          set -euo pipefail

          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          # macOS firewall can sometimes block incoming connections.
          # This is best-effort; do not fail the workflow if unavailable.
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off || true

          mkdir -p "$HOME/.config/code-server"

          umask 077
          cat > "$HOME/.config/code-server/config.yaml" <<EOF
          bind-addr: 0.0.0.0:${PORT}
          auth: password
          EOF

          PASSWORD="$CODE_SERVER_PASSWORD" nohup code-server \
            --disable-telemetry \
            "$WORKSPACE" \
            > /tmp/code-server.log 2>&1 &

          CODE_PID=$!
          disown "$CODE_PID" || true

          sleep 5

          if kill -0 "$CODE_PID" 2>/dev/null; then
            echo "✅ code-server running (PID $CODE_PID)"
          else
            echo "❌ code-server failed to start"
            cat /tmp/code-server.log || true
            exit 1
          fi

      # ── 10. Install useful VS Code extensions ────────────
      - name: 🧩 Install VS Code extensions
        run: |
          set -euo pipefail

          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          # Some Microsoft extensions may not be available in Open VSX.
          # Failures are ignored so the workflow continues.
          code-server --install-extension ms-python.python || true
          code-server --install-extension esbenp.prettier-vscode || true
          code-server --install-extension dbaeumer.vscode-eslint || true
          code-server --install-extension eamodio.gitlens || true

          echo "✅ Extensions installed"

      # ── 11. Print connection info ────────────────────────
      - name: 📋 Display connection details
        run: |
          set -euo pipefail

          TAILSCALE_BIN="$(command -v tailscale || true)"

          if [[ -z "$TAILSCALE_BIN" && -x /usr/local/bin/tailscale ]]; then
            TAILSCALE_BIN="/usr/local/bin/tailscale"
          fi

          if [[ -z "$TAILSCALE_BIN" && -x /opt/homebrew/bin/tailscale ]]; then
            TAILSCALE_BIN="/opt/homebrew/bin/tailscale"
          fi

          TAILSCALE_IP="unknown"
          TAILSCALE_DNS="unknown"

          if [[ -n "$TAILSCALE_BIN" ]]; then
            TAILSCALE_IP="$(sudo "$TAILSCALE_BIN" ip -4 2>/dev/null || "$TAILSCALE_BIN" ip -4 2>/dev/null || echo unknown)"

            TAILSCALE_DNS="$(sudo "$TAILSCALE_BIN" status --self --json 2>/dev/null \
              | python3 -c 'import sys, json; print(json.load(sys.stdin)["Self"]["DNSName"].rstrip("."))' \
              2>/dev/null || echo unknown)"
          fi

          if [[ -n "${CODE_SERVER_PASSWORD:-}" && "${CODE_SERVER_PASSWORD}" != "MEHRAZ123." ]]; then
            PASSWORD_DISPLAY="(stored in CODE_SERVER_PASSWORD secret)"
          else
            PASSWORD_DISPLAY="MEHRAZ123. (default - change immediately)"
          fi

          DIVIDER="════════════════════════════════════════════════════"

          echo ""
          echo "$DIVIDER"
          echo "  🖥️  MACOS REMOTE DEV ENVIRONMENT IS READY"
          echo "$DIVIDER"
          echo ""
          echo "  code-server (IP) :  http://${TAILSCALE_IP}:${PORT}"
          echo "  code-server (DNS):  http://${TAILSCALE_DNS}:${PORT}"
          echo ""
          echo "  Tailscale IP     :  ${TAILSCALE_IP}"
          echo "  Tailscale DNS    :  ${TAILSCALE_DNS}"
          echo ""
          echo "  Password         :  ${PASSWORD_DISPLAY}"
          echo ""
          echo "  Workspace        :  ${WORKSPACE}"
          echo "  Project          :  ${WORKSPACE}/project"
          echo "  Downloads        :  ${WORKSPACE}/Downloads -> $HOME/Downloads"
          echo ""
          echo "  Claude CLI       :  type 'claude' in any terminal"
          echo ""
          echo "  Timeout          :  ${{ github.event.inputs['session-timeout'] || '360' }} min"
          echo ""
          echo "  🛑 To stop early :  touch ~/stop"
          echo "       or cancel the workflow from GitHub Actions UI"
          echo ""
          echo "$DIVIDER"

          echo "::notice title=🖥️ code-server URL::http://${TAILSCALE_IP}:${PORT}"
          echo "::notice title=🔗 Tailscale DNS::http://${TAILSCALE_DNS}:${PORT}"
          echo "::notice title=🔑 Password::${PASSWORD_DISPLAY}"

      # ── 12. Keep alive loop ──────────────────────────────
      - name: ⏳ Keep session alive
        run: |
          set -euo pipefail

          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          echo "Session active — polling every 30s for ~/stop sentinel file..."
          echo "Runner will auto-terminate after ${{ github.event.inputs['session-timeout'] || '360' }} minutes."

          SECONDS_ALIVE=0

          while true; do
            if [[ -f "$HOME/stop" ]]; then
              echo "🛑 Stop file detected (~/stop). Shutting down gracefully."
              break
            fi

            # Health-check code-server
            if ! pgrep -f "code-server" >/dev/null 2>&1; then
              echo "⚠️  code-server process died — restarting..."

              PASSWORD="$CODE_SERVER_PASSWORD" nohup code-server \
                --disable-telemetry \
                "$WORKSPACE" \
                > /tmp/code-server.log 2>&1 &

              disown || true
              sleep 3
            fi

            sleep 30
            SECONDS_ALIVE=$((SECONDS_ALIVE + 30))

            if (( SECONDS_ALIVE % 300 == 0 )); then
              MINS=$((SECONDS_ALIVE / 60))
              echo "💓 Heartbeat — alive for ${MINS} minutes"
            fi
          done

          echo "👋 Session ended after $((SECONDS_ALIVE / 60)) minutes."
